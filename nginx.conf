worker_processes auto;
error_log /dev/stdout info;
access_log /dev/stdout;

events {
    worker_connections 1024;
    use epoll;
}

http {
    # ✅ PARA SA HTTP/2 AT GRPC
    http2 on;
    http2_body_preread_size 64k;
    http2_max_field_size 16k;
    http2_max_header_size 128k;
    keepalive_timeout 65;

    # ✅ SSL CERTIFICATES (Gamitin ang built-in ng OpenResty o ilagay ang sarili mo)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # ✅ Gamitin ang default cert ng OpenResty para gumana agad
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # ✅ KAILANGAN MAY SSL PARA GUMANA ANG HTTP/2 AT GRPC
    server {
        listen 8080 ssl http2 reuseport;
        listen [::]:8080 ssl http2 reuseport;
        server_name _;

        # ✅ EXISTING ROUTES – WALA BINAGO, PINAGANDA LANG ANG PROXY SETTINGS
        location /virgozki { 
            proxy_pass http://127.0.0.1:10000; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_request_buffering off;
        }
        location /virgozki-hu { 
            proxy_pass http://127.0.0.1:10001; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_request_buffering off;
        }
        location /virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10002; 
            proxy_http_version 1.1; 
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /vmess-virgozki { 
            proxy_pass http://127.0.0.1:10003; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_request_buffering off;
        }
        location /vmess-virgozki-hu { 
            proxy_pass http://127.0.0.1:10004; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
