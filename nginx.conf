worker_processes auto;
error_log /dev/stdout info;
access_log /dev/stdout;

events {
    worker_connections 1024;
    use epoll;
}

http {
    # ✅ PARA SA HTTP/2 AT GRPC
    http2 on;
    http2_body_preread_size 64k;
    http2_max_field_size 16k;
    http2_max_header_size 128k;
    keepalive_timeout 65;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    # ✅ SSL SETTINGS — GAMITIN ANG TAMANG PATH NG OPENRESTY
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # ✅ TAMANG DEFAULT CERT NG OPENRESTY — WALA NA ANG SIRA
    ssl_certificate /usr/local/openresty/nginx/conf/ssl/cert.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/key.pem;

    # ✅ SIGURADUHIN NA MAY SSL PARA GUMANA ANG HTTP/2 AT GRPC
    server {
        listen 8080 ssl http2 reuseport;
        listen [::]:8080 ssl http2 reuseport;
        server_name _;

        # ✅ EXISTING ROUTES – PINAGANDA ANG PROXY SETTINGS
        location /virgozki { 
            proxy_pass http://127.0.0.1:10000; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /virgozki-hu { 
            proxy_pass http://127.0.0.1:10001; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10002; 
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /vmess-virgozki { 
            proxy_pass http://127.0.0.1:10003; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /vmess-virgozki-hu { 
            proxy_pass http://127.0.0.1:10004; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /vmess-virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10005; 
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /vless-virgozki { 
            proxy_pass http://127.0.0.1:10006; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /vless-virgozki-hu { 
            proxy_pass http://127.0.0.1:10007; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /vless-virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10008; 
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /ss-virgozki { 
            proxy_pass http://127.0.0.1:10009; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /ss-virgozki-hu { 
            proxy_pass http://127.0.0.1:10010; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /ss-virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10011; 
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ✅ GRPC ROUTES — KUMPLETO NA AT TAMA NA
        location /vless-grpc {
            grpc_pass grpc://127.0.0.1:10012;
            grpc_set_header Host $host;
            grpc_set_header Content-Type application/grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_buffer_size 1M;
        }
        location /vmess-grpc {
            grpc_pass grpc://127.0.0.1:10013;
            grpc_set_header Host $host;
            grpc_set_header Content-Type application/grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_buffer_size 1M;
        }
        location /trojan-grpc {
            grpc_pass grpc://127.0.0.1:10014;
            grpc_set_header Host $host;
            grpc_set_header Content-Type application/grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_buffer_size 1M;
        }
        location /ss-grpc {
            grpc_pass grpc://127.0.0.1:10015;
            grpc_set_header Host $host;
            grpc_set_header Content-Type application/grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_buffer_size 1M;
        }

        # ✅ PANEL WEBSITE
        location / { 
            root /usr/local/openresty/nginx/html; 
            index index.html; 
        }
    }
}
